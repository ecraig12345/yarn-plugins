# The store layout prevents issues with different module layouts between local and CI
# causing failures due to changes in the dev bundles...
nodeLinker: pnpm
# The pnpm linker hardlinks from the global cache/index into node_modules, which fails with
# "EXDEV: cross-device link not permitted" on GitHub Actions Windows runners (cache defaults to
# C:, repo is checked out on D:). Keep the cache and index on the same drive as the repo.
# See https://github.com/yarnpkg/berry/issues/5326
enableGlobalCache: false
enableMirror: false
globalFolder: .yarn/berry

yarnPath: .yarn/releases/yarn-4.17.1.cjs

npmMinimalAgeGate: 7d

enableScripts: false

plugins:
  # This is a VERY basic "E2E" test for the engines plugin.
  # It's not perfect since this repo doesn't cover a lot of peer dep scenarios.
  - path: ./plugins/engines/dist/plugin.dev.js
  # This one is a no-op
  - path: ./plugins/npmrc/dist/plugin.dev.js

# Uncomment to probably show some errors
# engines:
#   includeDevDependencies: true
